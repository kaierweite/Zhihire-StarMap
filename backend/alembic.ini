# Alembic 配置文件
# 智聘星图后端数据库迁移配置。连接串优先从 app.config.settings 读取，
# 此处仅占位空字符串，真实连接由 alembic/env.py 动态注入。

[alembic]
# 迁移脚本目录
script_location = alembic
# 模板前缀时间戳
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# 时区
timezone = Asia/Shanghai
# Python 路径追加
prepend_sys_path = .
# 连接串留空，由 env.py 从 settings 注入
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S