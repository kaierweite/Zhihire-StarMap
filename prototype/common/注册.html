<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智聘星图</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#003527",
                        "primary-container": "#064e3b",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#80bea6",
                        "surface": "#f8f9ff",
                        "surface-container": "#edeeef",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#121c28",
                        "on-surface-variant": "#404944",
                        "outline": "#707974",
                        "outline-variant": "#bfc9c3",
                        "secondary": "#575e70"
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(191, 201, 195, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: all 0.3s;
            border-radius: 12px;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            background: #064e3b;
            color: #fff;
            padding: 12px 32px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.02em;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #003527;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(6, 78, 59, 0.25);
        }

        .btn-primary::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-20deg);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -150%
            }

            30% {
                left: 150%
            }

            100% {
                left: 150%
            }
        }

        .btn-ghost {
            border: 1px solid #121c28;
            color: #121c28;
            padding: 12px 32px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            background: transparent;
        }

        .btn-ghost:hover {
            background: #121c28;
            color: #fff;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }

        ::selection {
            background: #b0f0d6;
            color: #002117;
        }

        .role-tab {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .role-tab.active {
            background: #064e3b;
            color: #fff;
        }

        .role-tab:not(.active) {
            background: transparent;
            color: #404944;
            border-color: #bfc9c3;
        }

        .role-tab:not(.active):hover {
            border-color: #064e3b;
            color: #064e3b;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg)
            }

            50% {
                transform: translateY(-12px) rotate(3deg)
            }
        }

        .float-card {
            animation: float 6s ease-in-out infinite;
        }

        .float-card-delay {
            animation: float 6s ease-in-out 2s infinite;
        }

        .float-card-delay2 {
            animation: float 6s ease-in-out 4s infinite;
        }

        @keyframes floatDecor {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }

        .float-decor {
            animation: floatDecor 5s ease-in-out infinite;
        }

        .float-decor2 {
            animation: floatDecor 7s ease-in-out 1s infinite;
        }
    </style>
</head>

<body class="bg-surface min-h-screen">
    <div class="flex min-h-screen">
        <!-- Left Side: Form -->
        <div class="w-full lg:w-[560px] flex flex-col justify-center px-12 lg:px-16 relative z-10">
            <!-- Logo -->
            <div class="mb-8">
                <a href="首页着陆页.html" class="font-bold text-3xl tracking-tight text-primary">智聘星图</a>
            </div>

            <!-- Heading -->

            <!-- Role Tabs -->
            <div class="flex gap-2 mb-6" style="animation: fadeInUp 0.5s ease 0.15s forwards; opacity:0;">
                <div class="role-tab active" onclick="switchRole('jobseeker', this)">求职者</div>
                <div class="role-tab" onclick="switchRole('company', this)">企业</div>
            </div>

            <!-- Form -->
            <form class="flex flex-col gap-4" style="animation: fadeInUp 0.5s ease 0.2s forwards; opacity:0;"
                onsubmit="return false;">
                <!-- 姓名 (求职者显示) -->
                <div id="name-field">
                    <label
                        class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">姓名</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">person</span>
                        <input type="text" placeholder="请输入真实姓名"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-outline-variant/60 bg-white/80 backdrop-blur text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all text-sm">
                    </div>
                </div>

                <!-- 企业名称 (仅企业) -->
                <div id="company-field" class="hidden">
                    <label
                        class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">企业名称</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">business</span>
                        <input type="text" placeholder="请输入企业全称"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-outline-variant/60 bg-white/80 backdrop-blur text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all text-sm">
                    </div>
                </div>

                <!-- 行业领域 (仅企业) -->
                <div id="industry-field" class="hidden">
                    <label
                        class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">行业领域</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">category</span>
                        <select
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-outline-variant/60 bg-white/80 backdrop-blur text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all text-sm appearance-none">
                            <option value="">请选择行业领域</option>
                            <option>信息技术 / 软件</option>
                            <option>人工智能 / 大数据</option>
                            <option>金融科技</option>
                            <option>电子商务</option>
                            <option>智能制造</option>
                            <option>医疗健康</option>
                            <option>教育科技</option>
                            <option>其他</option>
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl pointer-events-none">expand_more</span>
                    </div>
                </div>

                <!-- 手机号 / 管理账号 (动态切换) -->
                <div>
                    <label id="account-label"
                        class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">手机号</label>
                    <div class="relative">
                        <span id="account-icon"
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">phone</span>
                        <input id="account-input" type="text" placeholder="请输入手机号码"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-outline-variant/60 bg-white/80 backdrop-blur text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all text-sm">
                    </div>
                </div>

                <!-- 密码 -->
                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">密码</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">lock</span>
                        <input type="password" placeholder="请设置密码（至少 8 位）"
                            class="w-full pl-12 pr-12 py-3 rounded-xl border border-outline-variant/60 bg-white/80 backdrop-blur text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all text-sm">
                        <button type="button"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-2">确认密码</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">lock</span>
                        <input type="password" placeholder="请再次输入密码"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-outline-variant/60 bg-white/80 backdrop-blur text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all text-sm">
                    </div>
                </div>

                <!-- Terms -->
                <label class="flex items-start gap-2 cursor-pointer mt-1">
                    <input type="checkbox"
                        class="w-4 h-4 mt-0.5 rounded border-outline-variant text-primary focus:ring-primary/20">
                    <span class="text-sm text-on-surface-variant">我已阅读并同意 <a href="#"
                            class="text-primary font-semibold hover:underline">服务条款</a> 和 <a href="#"
                            class="text-primary font-semibold hover:underline">隐私政策</a></span>
                </label>

                <!-- Submit -->
                <button type="submit" class="btn-primary w-full py-3.5 text-center mt-1">创建账号</button>
            </form>

            <!-- Login link -->
            <p class="text-center text-sm text-on-surface-variant mt-5 mb-6"
                style="animation: fadeInUp 0.5s ease 0.3s forwards; opacity:0;">
                已有账号？<a href="登录.html"
                    class="text-primary font-semibold hover:text-primary-dark transition-colors">立即登录</a>
            </p>
        </div>

        <!-- Right Side: Hero Visual -->
        <div class="hidden lg:flex flex-1 relative overflow-hidden items-center justify-center"
            style="background: linear-gradient(135deg, #064e3b 0%, #2b6954 50%, #003527 100%);">
            <!-- Ambient Orbs -->
            <div class="ambient-orb w-96 h-96 bg-white top-1/4 -left-10" style="opacity:0.07;"></div>
            <div class="ambient-orb w-72 h-72 bg-white bottom-10 right-20" style="opacity:0.05;"></div>
            <div class="ambient-orb w-56 h-56 bg-white top-10 right-1/4" style="opacity:0.06;"></div>

            <!-- Geometric Decorations -->
            <div class="absolute top-20 left-16 w-16 h-16 border border-white/10 rounded-2xl float-decor rotate-45">
            </div>
            <div class="absolute bottom-24 right-20 w-24 h-24 border border-white/8 rounded-full float-decor2"></div>
            <div class="absolute top-1/2 left-20 w-4 h-4 bg-white/15 rounded-full float-decor"></div>
            <div class="absolute top-32 right-1/3 w-6 h-6 border border-white/12 rounded float-decor2 rotate-12"></div>
            <div class="absolute bottom-40 left-1/3 w-3 h-3 bg-white/20 rounded-full"></div>

            <!-- Floating Glass Feature Cards -->
            <div class="relative z-10 flex flex-col items-center gap-6 w-full max-w-md px-8">
                <div class="float-card glass-card p-5 flex items-center gap-4 w-72"
                    style="background:rgba(255,255,255,0.12); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.2); box-shadow:0 8px 32px rgba(0,0,0,0.1);">
                    <div class="w-11 h-11 rounded-xl bg-white/20 flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-xl">upload_file</span>
                    </div>
                    <div>
                        <div class="text-white font-semibold text-sm">智能简历解析</div>
                        <div class="text-white/60 text-xs">AI 自动提取技能与经验</div>
                    </div>
                </div>
                <div class="float-card-delay glass-card p-5 flex items-center gap-4 w-72 ml-10"
                    style="background:rgba(255,255,255,0.12); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.2); box-shadow:0 8px 32px rgba(0,0,0,0.1);">
                    <div class="w-11 h-11 rounded-xl bg-white/20 flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-xl">hub</span>
                    </div>
                    <div>
                        <div class="text-white font-semibold text-sm">知识图谱分析</div>
                        <div class="text-white/60 text-xs">构建个人技能网络拓扑</div>
                    </div>
                </div>
                <div class="float-card-delay2 glass-card p-5 flex items-center gap-4 w-72"
                    style="background:rgba(255,255,255,0.12); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.2); box-shadow:0 8px 32px rgba(0,0,0,0.1);">
                    <div class="w-11 h-11 rounded-xl bg-white/20 flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-xl">trending_up</span>
                    </div>
                    <div>
                        <div class="text-white font-semibold text-sm">职业发展预测</div>
                        <div class="text-white/60 text-xs">数据驱动的成长路径规划</div>
                    </div>
                </div>
            </div>

            <!-- Bottom Tagline -->
            <div class="absolute bottom-10 left-0 right-0 text-center">
                <p class="text-white/40 text-xs tracking-widest uppercase font-semibold">Powered by 银河麒麟 · 人大金仓 ·
                    DeepSeek</p>
            </div>
        </div>
    </div>

    <script>
        function switchRole(role, el) {
            document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');

            const isCompany = (role === 'company');
            document.getElementById('name-field').classList.toggle('hidden', isCompany);
            document.getElementById('company-field').classList.toggle('hidden', !isCompany);
            document.getElementById('industry-field').classList.toggle('hidden', !isCompany);
        }
    </script>
</body>

</html>
