    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
        .dark ::-webkit-scrollbar-thumb { background: #333; }

        /* === 骨架屏流光 === */
        @keyframes shimmer-flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton-shimmer {
            position: relative; overflow: hidden; background: #E8E6E3; border-radius: 6px;
        }
        .dark .skeleton-shimmer { background: #1A1B21; }
        .skeleton-shimmer::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,102,0.06), transparent);
            animation: shimmer-flow 2s infinite;
        }

        /* === 3D tilt === */
        .tilt-card {
            transform-style: preserve-3d; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .tilt-card:hover {
            box-shadow: 0 12px 40px rgba(6,78,59,0.1);
        }
        .dark .tilt-card:hover {
            box-shadow: 0 12px 40px rgba(0,255,102,0.08);
        }

        /* === 粒子动画 === */
        @keyframes particle-fly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }
        .particle {
            position: absolute; width: 4px; height: 4px; border-radius: 50%; pointer-events: none;
            animation: particle-fly 0.7s ease-out forwards;
        }

        /* === 搜索框呼吸 === */
        @keyframes search-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,53,39,0); }
            50% { box-shadow: 0 0 0 3px rgba(6,78,59,0.08); }
        }
        .dark .search-glow-dark {
            animation: search-glow-dark 2s ease-in-out infinite;
        }
        @keyframes search-glow-dark {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,102,0); }
            50% { box-shadow: 0 0 0 3px rgba(0,255,102,0.08); }
        }
        .search-active { animation: search-glow 2s ease-in-out infinite; }

        /* === 投递成功钩 === */
        @keyframes check-draw {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }
        .check-icon { stroke-dasharray: 20; animation: check-draw 0.4s ease forwards 0.2s; stroke-dashoffset: 20; }

        /* === 淡入 === */
        @keyframes fadeSlide { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .fade-slide { animation: fadeSlide 0.35s ease forwards; }

        /* 标签样式 */
        .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }
        .tag { background: rgba(0,0,0,0.04); color: #666; }
        .dark .tag { background: rgba(255,255,255,0.06); color: #888; }

        /* === 筛选标签 === */
        .filter-tag {
            padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
            color: #374151; background: transparent; border: none; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .filter-tag:hover { background: #F3F4F6; }
        .filter-tag.active {
            background: #E8F5E9; color: #064E3B; font-weight: 600;
        }
        .dark .filter-tag { color: #9CA3AF; }
        .dark .filter-tag:hover { background: #1A1B21; }
        .dark .filter-tag.active { background: rgba(0,255,102,0.1); color: #00FF66; }

        /* === 导航栏匹配首页着陆页 === */
        .nav-link {
            font-size: 13px; font-weight: 500; padding: 6px 0; transition: all 0.2s;
            text-decoration: none; white-space: nowrap; position: relative;
        }
        .nav-link.active-nav {
            color: #064e3b; font-weight: 700;
            border-bottom: 2px solid #064e3b;
        }
        .dark .nav-link.active-nav {
            color: #00FF66; border-bottom-color: #00FF66;
        }
        .nav-link:not(.active-nav) { color: #404944; }
        .nav-link:not(.active-nav):hover { color: #064e3b; }
        .dark .nav-link:not(.active-nav) { color: #888; }
        .dark .nav-link:not(.active-nav):hover { color: #00FF66; }

        /* === 汉堡菜单 === */
        .mobile-menu {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: #fff; border-top: 1px solid #d9e3f4;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 50;
        }
        .dark .mobile-menu { background: #141519; border-top-color: #2A2B33; }
        .mobile-menu.open { display: block; }

        /* === 其他筛选下拉 === */
        .filter-dropdown {
            padding: 5px 28px 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
            color: #374151; background: #F9FAFB; border: 1px solid #E5E7EB; cursor: pointer;
            transition: all 0.2s ease; outline: none; min-width: 90px;
        }
        .filter-dropdown:hover { border-color: #D1D5DB; background: #F3F4F6; }
        .filter-dropdown:focus { border-color: #064E3B; box-shadow: 0 0 0 2px rgba(6,78,59,0.08); }
        .dark .filter-dropdown { background: #1A1B21; border-color: #2A2B33; color: #9CA3AF; }
        .dark .filter-dropdown:hover { border-color: #3A3B43; }

        /* === 更多按钮 === */
        .more-btn {
            font-size: 13px; color: #F59E0B; font-weight: 500; cursor: pointer;
            transition: color 0.2s ease; white-space: nowrap;
        }
        .more-btn:hover { color: #D97706; }

        /* === 列表滚动条 === */
        #jobList::-webkit-scrollbar { width: 6px; }
        #jobList::-webkit-scrollbar-track { background: transparent; }
        #jobList::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        .dark #jobList::-webkit-scrollbar-thumb { background: #333; }
            .active-tab { color: #064e3b; border-bottom: 2px solid #064e3b; font-weight: 700; }
    </style>
</head>

function toggleFilterTag(btn) {
    const group = btn.dataset.filter;
    const value = btn.dataset.value;

    // 如果是"不限"/"全国"，清除同组其他选中
    if (value === '不限' || value === '全国') {
        document.querySelectorAll(`.filter-tag[data-filter="${group}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterState[group] = value;
    } else {
        // 取消"不限"/"全国"
        const defaultVal = group === 'city' ? '全国' : '不限';
        document.querySelector(`.filter-tag[data-filter="${group}"][data-value="${defaultVal}"]`)?.classList.remove('active');
        // 切换当前
        btn.classList.toggle('active');
        // 收集所有选中
        const selected = [...document.querySelectorAll(`.filter-tag[data-filter="${group}"].active`)].map(b => b.dataset.value);
        if (selected.length === 0) {
            // 没有选中，恢复"不限"/"全国"
            document.querySelector(`.filter-tag[data-filter="${group}"][data-value="${defaultVal}"]`)?.classList.add('active');
            filterState[group] = defaultVal;
        } else {
            filterState[group] = selected.join(',');
        }
    }
    applyAllFilters();
}

// ===== AI语义解析搜索 =====
function doSemanticSearch() {
    const input = document.getElementById('searchInput').value.trim();
    if (!input) { applyAllFilters(); return; }

    // 模拟LLM解析
    const parsed = { city: '', salaryMin: 0, salaryMax: 999, keywords: [] };
    if (/上海|北京|深圳|杭州|广州|成都|重庆|武汉|西安/.test(input)) {
        parsed.city = input.match(/(上海|北京|深圳|杭州|广州|成都|重庆|武汉|西安)/)[1];
    }
    const salaryMatch = input.match(/(\d+)k|(\d+)万/i);
    if (salaryMatch) parsed.salaryMin = parseInt(salaryMatch[1] || salaryMatch[2]);
    const techMatch = input.match(/vue|react|java|python|go|flutter|typescript|算法/i);
    if (techMatch) parsed.keywords.push(techMatch[0].toLowerCase());
    const remoteMatch = /远程/.test(input);
    const noOvertime = /不加班|不.*加班/.test(input);

    // 显示解析标签
    const tagsEl = document.getElementById('parsedTags');
    const tagsInner = document.getElementById('parsedTagsInner');
    let tagsHtml = '';
    if (parsed.city) tagsHtml += `<span class="tag bg-emerald-50 dark:bg-neon-green/10 text-emerald-600 dark:text-neon-green">${parsed.city}</span>`;
    if (parsed.salaryMin) tagsHtml += `<span class="tag bg-blue-50 dark:bg-neon-blue/10 text-blue-600 dark:text-neon-blue">${parsed.salaryMin}K+</span>`;
    if (parsed.keywords.length) tagsHtml += parsed.keywords.map(k => `<span class="tag bg-purple-50 dark:bg-neon-purple/10 text-purple-600 dark:text-neon-purple">${k}</span>`).join('');
    if (remoteMatch) tagsHtml += `<span class="tag bg-cyan-50 dark:bg-neon-cyan/10 text-cyan-600 dark:text-neon-cyan">远程</span>`;
    if (noOvertime) tagsHtml += `<span class="tag bg-green-50 dark:bg-green-500/10 text-green-600 dark:text-green-400">不加班</span>`;

    if (tagsHtml) {
        tagsInner.innerHTML = tagsHtml;
        tagsEl.classList.remove('hidden');
        setTimeout(() => tagsEl.classList.add('hidden'), 4000);
    }

    // 更新筛选
    if (parsed.city) {
        filterState.city = parsed.city;
        document.querySelectorAll('.filter-tag[data-filter="city"]').forEach(b => b.classList.remove('active'));
        const cityBtn = document.querySelector(`.filter-tag[data-filter="city"][data-value="${parsed.city}"]`);
        if (cityBtn) cityBtn.classList.add('active');
    }
    if (parsed.salaryMin >= 10 && parsed.salaryMin < 20) document.getElementById('fEdu') && 0; // salary handled via keywords
    else if (parsed.salaryMin >= 20 && parsed.salaryMin < 30) 0;
    else if (parsed.salaryMin >= 30 && parsed.salaryMin < 50) 0;
    else if (parsed.salaryMin >= 50) 0;

    applyAllFilters(parsed.keywords);
}

// ===== 筛选逻辑 =====
function applyAllFilters(extraKeywords) {
    const cityFilter = filterState.city === '全国' ? '' : filterState.city;
    const majorFilter = filterState.major === '不限' ? '' : filterState.major;
    const jobTypeFilter = filterState.jobType === '不限' ? '' : filterState.jobType;
    const edu = document.getElementById('fEdu').value;
    const industry = document.getElementById('fIndustry').value;
    const companyType = document.getElementById('fCompanyType').value;
    const companySize = document.getElementById('fCompanySize').value;

    let filtered = jobs.filter(j => {
        if (cityFilter && j.city !== cityFilter) return false;
        if (edu && j.edu !== edu) return false;
        if (jobTypeFilter && j.type !== jobTypeFilter) return false;
        if (industry && j.industry !== industry) return false;
        if (companySize) {
            const sizeMap = { '10000+': '10000人以上' };
            if (j.size !== (sizeMap[companySize] || companySize)) return false;
        }
        if (majorFilter) {
            // 简单匹配：专业与行业/标签关联
            const majorIndustry = {
                '会计学': ['金融'], '财务管理': ['金融'], '电子商务': ['互联网'], '计算机科学与技术': ['互联网','数据库','硬件'],
                '软件工程': ['互联网','数据库'], '工商管理': ['互联网','金融','硬件'], '土木工程': [],
                '学前教育': ['教育'], '市场营销': ['互联网','硬件']
            };
            const related = majorIndustry[majorFilter] || [];
            if (related.length && !related.includes(j.industry)) return false;
        }
        if (extraKeywords && extraKeywords.length) {
            const jTagsLower = j.tags.map(t => t.toLowerCase()).join(' ');
            const match = extraKeywords.some(k => jTagsLower.includes(k) || j.title.toLowerCase().includes(k));
            if (!match) return false;
        }
        return true;
    });

    // 默认按匹配度排序
    filtered.sort((a, b) => b.match - a.match);

    renderList(filtered);
    updateTags();
}

function resetFilters() {
    filterState.major = '不限';
    filterState.city = '全国';
    filterState.jobType = '不限';
    document.getElementById('fEdu').value = '';
    document.getElementById('fIndustry').value = '';
    document.getElementById('fCompanyType').value = '';
    document.getElementById('fCompanySize').value = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('parsedTags').classList.add('hidden');
    // 重置标签按钮
    document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.filter-tag[data-value="不限"], .filter-tag[data-value="全国"]').forEach(b => b.classList.add('active'));
    applyAllFilters();
}

function updateTags() {
    const tags = [];
    if (filterState.city !== '全国') tags.push({ key: 'city', label: filterState.city });
    if (filterState.major !== '不限') tags.push({ key: 'major', label: filterState.major });
    if (filterState.jobType !== '不限') tags.push({ key: 'jobType', label: filterState.jobType });
    const edu = document.getElementById('fEdu').value;
    if (edu) tags.push({ key: 'edu', label: edu });
    const industry = document.getElementById('fIndustry').value;
    if (industry) tags.push({ key: 'industry', label: industry });
    const companyType = document.getElementById('fCompanyType').value;
    if (companyType) tags.push({ key: 'companyType', label: companyType });
    const companySize = document.getElementById('fCompanySize').value;
    if (companySize) tags.push({ key: 'companySize', label: companySize });

    document.getElementById('activeTags').innerHTML = tags.map(t =>
        `<span class="tag bg-emerald-50 dark:bg-neon-green/10 text-emerald-600 dark:text-neon-green cursor-pointer hover:opacity-70 transition-opacity" onclick="clearTag('${t.key}')">${t.label} ×</span>`
    ).join('');
}

function clearTag(key) {
    if (key === 'city') { filterState.city = '全国'; document.querySelectorAll('.filter-tag[data-filter="city"]').forEach(b => b.classList.remove('active')); document.querySelector('.filter-tag[data-filter="city"][data-value="全国"]').classList.add('active'); }
    else if (key === 'major') { filterState.major = '不限'; document.querySelectorAll('.filter-tag[data-filter="major"]').forEach(b => b.classList.remove('active')); document.querySelector('.filter-tag[data-filter="major"][data-value="不限"]').classList.add('active'); }
    else if (key === 'jobType') { filterState.jobType = '不限'; document.querySelectorAll('.filter-tag[data-filter="jobType"]').forEach(b => b.classList.remove('active')); document.querySelector('.filter-tag[data-filter="jobType"][data-value="不限"]').classList.add('active'); }
    else if (key === 'edu') document.getElementById('fEdu').value = '';
    else if (key === 'industry') document.getElementById('fIndustry').value = '';
    else if (key === 'companyType') document.getElementById('fCompanyType').value = '';
    else if (key === 'companySize') document.getElementById('fCompanySize').value = '';
    applyAllFilters();
}

// ===== 3D倾斜 =====
function tiltCard(e, el) {
    const rect = el.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    el.style.transform = `perspective(600px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg) translateZ(2px)`;
}
function resetTilt(el) {
    el.style.transform = 'perspective(600px) rotateY(0) rotateX(0) translateZ(0)';
}

// ===== 投递 + 粒子 =====
function applyJob(btn) {
    if (btn.dataset.applied) return;
    btn.dataset.applied = '1';

    // 粒子爆发
    const rect = btn.getBoundingClientRect();
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 30 + Math.random() * 40;
        p.style.cssText = `
            left: ${rect.width / 2}px; top: ${rect.height / 2}px;
            --tx: ${Math.cos(angle) * dist}px; --ty: ${Math.sin(angle) * dist}px;
            background: ${['#00FF66','#0066FF','#8B5CF6','#06B6D4'][i % 4]};
        `;
        btn.appendChild(p);
    }

    // 按钮状态变化
    btn.innerHTML = `<svg class="w-4 h-4 inline-block mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" class="check-icon"/></svg> 已投递`;
    btn.className = 'px-5 py-2 bg-emerald-100 dark:bg-neon-green/20 text-emerald-600 dark:text-neon-green text-sm font-semibold rounded-lg cursor-default';
}

    '山东': ['济南','青岛','烟台','潍坊','临沂','济宁','淄博','威海','德州','聊城','泰安','菏泽','枣庄','日照','东营','滨州','枣庄'],
    '浙江': ['杭州','宁波','温州','嘉兴','湖州','绍兴','金华','台州','衢州','丽水','舟山']
};
let citySelected = [];
let currentProvince = '热门';

function openCityModal() {
    document.getElementById('cityModal').classList.remove('hidden');
    citySelected = [...(filterState.city !== '全国' ? filterState.city.split(',') : [])];
    currentProvince = '热门';
    renderCityProvinces();
    renderCityGrid();
    updateCityInfo();
}
function closeCityModal() { document.getElementById('cityModal').classList.add('hidden'); }

function renderCityProvinces() {
    const el = document.getElementById('cityProvinceList');
    el.innerHTML = Object.keys(cityProvinceData).map(p =>
        `<div class="px-4 py-2.5 text-sm cursor-pointer hover:bg-gray-50 transition-colors ${currentProvince===p?'text-emerald-600 font-semibold bg-emerald-50/50':'text-gray-600'}" onclick="selectProvince('${p}')">${p}<span class="float-right text-gray-300 text-xs">›</span></div>`
    ).join('');
}
function selectProvince(p) { currentProvince = p; renderCityProvinces(); renderCityGrid(); }

function renderCityGrid() {
    const cities = cityProvinceData[currentProvince] || [];
    document.getElementById('cityGrid').innerHTML = `<div class="flex flex-wrap gap-2">${cities.map(c =>
        `<button class="px-4 py-2 text-sm rounded-lg border transition-all ${citySelected.includes(c)?'bg-emerald-50 text-emerald-700 border-emerald-200 font-semibold':'bg-gray-50 text-gray-600 border-gray-100 hover:bg-gray-100 hover:border-gray-200'}" onclick="toggleCity('${c}')">${c}</button>`
    ).join('')}</div>`;
}
function toggleCity(c) {
    const idx = citySelected.indexOf(c);
    if (idx > -1) citySelected.splice(idx, 1);
    else if (citySelected.length < 5) citySelected.push(c);
    renderCityGrid();
    updateCityInfo();
}
function updateCityInfo() {
    document.getElementById('citySelectedInfo').textContent = `已选：${citySelected.length} / 5`;
}
function confirmCity() {
    if (citySelected.length > 0) {
        filterState.city = citySelected.join(',');
        document.querySelectorAll('[data-filter="city"]').forEach(b => {
            b.classList.toggle('active', b.dataset.value === '全国' && citySelected.length === 0);
        });
    }
    closeCityModal();
    applyAllFilters();
}
function filterCitySearch(q) {
    if (!q.trim()) { currentProvince = '热门'; renderCityProvinces(); renderCityGrid(); return; }
    q = q.toLowerCase();
    const results = [];
    for (const [p, cities] of Object.entries(cityProvinceData)) {
        cities.forEach(c => { if (c.toLowerCase().includes(q) && !results.includes(c)) results.push(c); });
    }
    if (results.length) {
        document.getElementById('cityGrid').innerHTML = `<div class="flex flex-wrap gap-2">${results.map(c =>
            `<button class="px-4 py-2 text-sm rounded-lg border transition-all ${citySelected.includes(c)?'bg-emerald-50 text-emerald-700 border-emerald-200 font-semibold':'bg-gray-50 text-gray-600 border-gray-100 hover:bg-gray-100 hover:border-gray-200'}" onclick="toggleCity('${c}')">${c}</button>`
        ).join('')}</div>`;
        document.getElementById('cityProvinceList').innerHTML = '<div class="text-sm text-gray-300 text-center mt-10">搜索结果</div>';
    }
}
</script>
    <script>
        function toggleInterviewDD(e, suffix) {
            e.stopPropagation();
            var dd = document.getElementById('interviewDD-' + suffix);
            var arrow = document.getElementById('interview-arrow-' + suffix);
            if (dd) dd.classList.toggle('hidden');
            if (arrow) arrow.style.transform = dd && dd.classList.contains('hidden') ? '' : 'rotate(180deg)';
        }
        function closeInterviewDD(suffix) {
            var dd = document.getElementById('interviewDD-' + suffix);
            var arrow = document.getElementById('interview-arrow-' + suffix);
            if (dd) dd.classList.add('hidden');
            if (arrow) arrow.style.transform = '';
        }
        document.addEventListener('click', function(e) {
            ['desk', 'mob'].forEach(function(s) {
                var wrap = document.getElementById('interviewDD-wrap-' + s);
                if (wrap && !wrap.contains(e.target)) closeInterviewDD(s);
            });
        });
        function toggleMobileMenu() {
            var menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }
        function logout() {
            localStorage.removeItem('loggedIn');
            window.location.href = '../common/登录.html';
        }
    </script>
